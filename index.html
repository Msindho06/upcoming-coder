<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RiseTogether</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#e8f3ff;--card:#ffffff;--ink:#0f2a47;--mut:#476584;--acc:#1668c9;--acc2:#3b9ae8;--ok:#157a4b;--bad:#c0303b;--line:#c7ddf3;--soft:#dcecfb;--on:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e2036;--card:#152c47;--ink:#eaf4ff;--mut:#a9c3df;--acc:#6db8ff;--acc2:#8cc9ff;--ok:#4fd08f;--bad:#ff7a84;--line:#27486b;--soft:#1d3a5a;--on:#06213a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e2036;--card:#152c47;--ink:#eaf4ff;--mut:#a9c3df;--acc:#6db8ff;--acc2:#8cc9ff;--ok:#4fd08f;--bad:#ff7a84;--line:#27486b;--soft:#1d3a5a;--on:#06213a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:14px 14px 70px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-weight:800;font-size:21px}.logo span{color:var(--acc)}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 0 12px;margin-bottom:6px}
nav button{white-space:nowrap;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
nav button.on{background:var(--acc);border-color:var(--acc);color:var(--on)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
h1{font-size:25px;line-height:1.2;margin:0 0 6px}h2{font-size:18px;margin:0 0 8px}h3{font-size:15px;margin:0 0 4px}
p{margin:0 0 10px}.mut{color:var(--mut)}.sm{font-size:13px}
.btn{display:inline-block;border:0;border-radius:12px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--acc);color:var(--on);margin:0 6px 6px 0}
.btn.g{background:var(--soft);color:var(--ink)}.btn.sm{padding:7px 11px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.in{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;margin-bottom:9px}
textarea.in{min-height:150px;resize:vertical}
.chip{display:inline-block;background:var(--soft);border-radius:99px;padding:2px 10px;font-size:12.5px;margin:0 5px 5px 0}
.quote{border-left:4px solid var(--acc2);background:var(--soft);padding:8px 12px;border-radius:0 10px 10px 0;font-size:14px;margin:10px 0}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 13px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.opt.sel{border-color:var(--acc);background:var(--soft)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--card))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--card))}
.bar{height:10px;border-radius:9px;background:var(--line);overflow:hidden}.bar b{display:block;height:100%;background:var(--acc);border-radius:9px;transition:width .5s}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.row{display:flex;align-items:center;gap:10px;margin:7px 0;flex-wrap:wrap}.grow{flex:1;min-width:120px}
.av{font-size:24px;width:34px;text-align:center;border-radius:50%}
.av.spk{box-shadow:0 0 0 3px var(--ok);animation:p 1s infinite}
@keyframes p{50%{box-shadow:0 0 0 7px transparent}}
.chat{height:190px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px;font-size:14px;background:var(--bg)}
.chat div{margin-bottom:5px}.clock{font-variant-numeric:tabular-nums;font-weight:800;font-size:26px}
.demo{background:color-mix(in srgb,var(--acc2) 18%,var(--card));border:1px dashed var(--acc2);border-radius:10px;padding:6px 10px;font-size:13px;margin-bottom:8px}
.ai{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14.5px;margin-top:8px;white-space:pre-wrap}
.err{color:var(--bad);font-size:14px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div class="logo">Rise<span>Together</span></div><div class="sm mut">Study smarter. Rise together.</div><button class="btn g sm" data-a="reset" style="margin:0">↺ Start fresh</button></div>
<nav id="nav" aria-label="Main"></nav>
<div id="bar" role="alert" aria-live="assertive"></div>
<main id="app"></main>
<p class="sm mut" style="text-align:center;margin-top:20px">Prototype built with AI assistance. Idea and design direction by the student creator.</p>
</div>
<script>
var $=function(s){return document.querySelector(s)};
function e(x){return String(x==null?"":x).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function cap(n){return n==="room"?Promise.resolve({join:function(nm){try{return Promise.resolve(mkRoomLocal(nm))}catch(x){return Promise.reject(x)}}}):Promise.resolve(null)}
var CFG={key:"",model:"claude-sonnet-5-5",remember:false};
function ai(p,json){if(navigator.onLine===false)return Promise.reject({code:"offline"});if(!CFG.key)return Promise.reject({code:"nokey"});
var tt=new Promise(function(_,r){setTimeout(function(){r({code:"timeout"})},60000)});
var call=fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":CFG.key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:CFG.model,max_tokens:2500,messages:[{role:"user",content:p}]})}).then(function(r){if(r.status===401||r.status===403)throw{code:"badkey"};if(r.status===429)throw{code:"limit"};if(!r.ok)throw{code:"net"};return r.json()}).then(function(d){var t=(d.content||[]).map(function(b){return b.text||""}).join("");if(!json)return t;var m=t.replace(/```json|```/g,"").trim(),a=m.indexOf("{"),b=m.lastIndexOf("}");return JSON.parse(m.slice(a,b+1))}).catch(function(x){throw x&&x.code?x:(x instanceof SyntaxError?x:{code:"net"})});
return Promise.race([call,tt])}
function em(x){return x&&x.code==="offline"?"You seem to be offline. Check your connection and try again.":x&&x.code==="timeout"?"That took too long. Please try again.":x&&x.code==="nokey"?"Add your AI key in Settings to use the AI features.":x&&x.code==="badkey"?"The AI key was rejected. Check it in Settings.":x&&x.code==="limit"?"Too many requests right now. Wait a moment and try again.":x&&x.code==="net"?"Couldn’t reach the AI. Check your internet connection and key.":"The AI couldn’t do that just now. Please try again."}
var COURSES=[];
var LIB=[{t:"Cell biology summary",course:"Biology 101",topic:"Cells",by:"Lerato"},{t:"Python loops explained",course:"Programming 101",topic:"Control flow",by:"Thando"},{t:"Essay writing checklist",course:"Communication",topic:"Writing",by:"Sipho"}];
var ROOMS=[];
var EMO=["🙂","😎","🦊","🌟","🐯","🚀"],U={nick:"Student",e:EMO[Math.floor(Math.random()*6)]};
var V="dash",cur={c:0,h:0,s:0},P=freshP(),RM=null,CH=null,NR=null,demoOn=false,tmr=null,spk=0,lib={q:"",c:""};
var DEMO=[{n:"Thando",e:"🧑🏾‍🎓",pk:0},{n:"Lerato",e:"👩🏽‍🎓",pk:0},{n:"Sipho",e:"🧑🏿‍🎓",pk:1}];
var NAV=[["dash","Dashboard"],["courses","My Courses"],["lib","Resources"],["rooms","Study Rooms"],["prog","Progress"],["settings","Settings"]];
function sec(){var c=COURSES[cur.c];return c&&c.ch[cur.h]&&c.ch[cur.h].secs[cur.s]}
function seenN(){return Object.keys(P.seen).length}
function opts(q,k){return q.o.map(function(x,i){return '<button class="opt" data-a="'+k+'" data-i="'+i+'">'+e(x)+'</button>'}).join("")}
function go(v){if(v!=="room"){leave()}V=v;render()}
function render(){save();try{render0()}catch(x){$("#app").innerHTML='<div class="card"><h2>Something went wrong showing this page</h2><p>Your work is still safe. Try going back to the dashboard.</p><button class="btn" data-a="go" data-v="dash">Back to dashboard</button><button class="btn g" data-a="reset">Start fresh</button></div>'}}
function render0(){if(V==="study"&&!sec())V="dash";if(V==="room"&&!RM)V="rooms";var on=V==="study"?"courses":V==="room"?"rooms":V;$("#nav").innerHTML=NAV.map(function(n){return '<button data-a="go" data-v="'+n[0]+'"'+(n[0]===on?' class="on" aria-current="page"':'')+'>'+n[1]+'</button>'}).join("");
var f={dash:dash,courses:courses,study:study,lib:library,rooms:rooms,room:roomV,prog:progress,settings:settingsV}[V];$("#app").innerHTML=f();if(V==="room")roomInit();window.scrollTo(0,0)}
function freshP(){return{seen:{},qs:0,ok:0,ch:0,retry:0,goal:3}}
function seenCourses(){return COURSES.map(function(c,i){return i}).filter(function(i){return Object.keys(P.seen).some(function(k){return k.indexOf(i+"-")===0})})}
function dash(){var s=sec(),n=seenN(),g=Math.min(P.goal,n),rc=seenCourses(),h='<div class="card"><h1>'+(n?"Welcome back 👋":"Welcome 👋")+'</h1><p class="mut">Small steps count. Every time you show up, you’re making progress.</p>';
if(!COURSES.length)h+='<p>You have no courses yet. Add your own slides, or open the demo lesson to explore without an AI key.</p><button class="btn" data-a="go" data-v="courses">➕ Add my slides</button><button class="btn g" data-a="loaddemo">Open the demo lesson</button>';
else if(n&&s)h+='<button class="btn" data-a="open" data-c="'+cur.c+'" data-h="'+cur.h+'" data-s="'+cur.s+'">▶ Continue studying</button><button class="btn g" data-a="open" data-c="0" data-h="0" data-s="0">Start from the beginning</button><span class="sm mut">'+e(s.t)+'</span>';
else h+='<button class="btn" data-a="open" data-c="0" data-h="0" data-s="0">▶ Start learning</button>';
h+='</div><div class="grid"><div class="card"><h2>Daily goal</h2><p>Study '+P.goal+' sections today: <b>'+g+'/'+P.goal+'</b></p><div class="bar"><b style="width:'+(g/P.goal*100)+'%"></b></div><p class="sm mut" style="margin-top:8px">'+(g>=P.goal?"Goal reached. Brilliant! 🎉":"A little at a time is enough.")+'</p></div><div class="card"><h2>Upcoming sessions</h2>'+(ROOMS.length?ROOMS.map(function(r){return '<div class="row"><div class="grow"><b>'+e(r.n)+'</b><br><span class="sm mut">Code '+e(r.code)+'</span></div><button class="btn sm" data-a="enter" data-code="'+e(r.code)+'">Join</button></div>'}).join(""):'<p class="mut">No rooms yet.</p><button class="btn g sm" data-a="go" data-v="rooms">Create a study room</button>')+'</div></div>';
if(rc.length)h+='<div class="row"><h2 class="grow" style="margin:0">Recent courses</h2><button class="btn g sm" data-a="clearrecent">Clear recent activity</button></div>'+rc.map(function(i){return cCard(COURSES[i],i)}).join("");
return h}
function cCard(c,i){var n=c.ch.reduce(function(a,h){return a+h.secs.length},0);return '<div class="card"><div class="row"><div class="grow"><h2 style="margin:0">'+e(c.name)+'</h2><span class="sm mut">'+c.ch.length+' chapters · '+n+' sections'+(c.demo?' · demo lesson':'')+'</span></div></div>'+c.ch.map(function(h,j){return '<h3 style="margin-top:8px">'+e(h.n)+'</h3>'+h.secs.map(function(s,k){return '<button class="btn g sm" data-a="open" data-c="'+i+'" data-h="'+j+'" data-s="'+k+'">'+(P.seen[i+"-"+j+"-"+k]?"✓ ":"")+e(s.t)+'</button>'}).join("")}).join("")+'<p class="sm" style="margin-top:8px"><label>Who can see this? <select data-ch="vis" data-c="'+i+'" class="in" style="width:auto;margin:0"><option value="private"'+(c.vis==="private"?" selected":"")+'>Only me (private)</option><option value="room"'+(c.vis==="room"?" selected":"")+'>Shared with my study rooms</option><option value="library"'+(c.vis==="library"?" selected":"")+'>Shared library (everyone)</option></select></label> <button class="btn g sm" data-a="rmcourse" data-c="'+i+'">🗑 Remove this course</button></p></div>'}
function courses(){return '<h1>My Courses</h1><p class="mut">Everything you add is <b>private</b> until you choose otherwise.</p>'+(COURSES.length?COURSES.map(cCard).join(""):'<div class="card"><p>No courses yet. Add your own slides below, or <button class="btn g sm" data-a="loaddemo">open the demo lesson</button> (works without an AI key).</p></div>')+'<div class="card"><h2>➕ Add course material</h2><div class="demo"><b>What works:</b> PDF (with selectable text), PowerPoint (.pptx), Word (.docx), .txt and .md files, or pasted text. They are read in your browser, then AI turns them into a lesson (add your AI key in Settings first). <b>Not supported:</b> scanned PDFs (they are images) and old .doc/.ppt files.</div><input class="in" id="uc" placeholder="Course name (e.g. Biology 101)"><input class="in" id="uh" placeholder="Chapter name (e.g. Chapter 3: Cell structure)"><textarea class="in" id="ut" placeholder="Paste your slide text here, for example “Slide 4: …”"></textarea><input class="in" type="file" id="uf" accept=".txt,.md,.pdf,.pptx,.docx" aria-label="Choose a file"><button class="btn g sm" data-a="clearfile">✖ Remove file / clear text</button><label class="sm">Visibility <select class="in" id="uv" style="width:auto"><option value="private">Only me (private)</option><option value="room">Shared with my study rooms</option><option value="library">Shared library (everyone)</option></select></label><br><button class="btn" data-a="build">✨ Build lesson</button><p class="err" id="us"></p></div>'}
function study(){var c=COURSES[cur.c],h=c.ch[cur.h],s=h.secs[cur.s],key=cur.c+"-"+cur.h+"-"+cur.s;if(!P.seen[key])P.seen[key]=1;var n=h.secs.length;
return '<p><button class="btn g sm" data-a="go" data-v="courses">← My Courses</button></p><div class="card"><span class="chip">'+e(c.name)+'</span><span class="chip">'+e(h.n)+'</span><span class="chip">Slide/page '+e(s.slide)+'</span><h1>'+e(s.t)+'</h1><h3>In simple words</h3><p>'+e(s.say)+'</p><div class="quote"><b>Check it against slide '+e(s.slide)+':</b> '+e(s.ex)+'</div>'+(s.caveat?'<div class="demo">⚠️ Not sure: '+e(s.caveat)+'</div>':'')+'<h3>Key terms</h3><p>'+s.terms.map(function(x){return '<span class="chip">🔑 '+e(x)+'</span>'}).join("")+'</p><h3>Summary</h3><p>'+e(s.sum)+'</p><div class="demo">Explanations are AI-written from your slides. Always check the slide.</div></div><div class="card"><h2>Practice question</h2><p>'+e(s.q.t)+'</p>'+opts(s.q,"ans")+'<div id="fb"></div></div><div class="card"><h2>Ask a follow-up</h2><input class="in" id="ask" placeholder="e.g. What does this term mean?"><button class="btn" data-a="ask">Ask</button><div id="aa"></div></div><p>'+(cur.s>0?'<button class="btn g" data-a="step" data-d="-1">← Previous</button>':'')+(cur.s<n-1?'<button class="btn" data-a="step" data-d="1">Next section →</button>':'')+'<button class="btn g" data-a="quickroom">Study this in a room</button></p>'}
function library(){var all=LIB.map(function(r){return{t:r.t,course:r.course,topic:r.topic,by:r.by+" (demo listing)",demo:1}}).concat(COURSES.filter(function(c){return c.vis==="library"}).map(function(c){return{t:c.name,course:c.name,topic:c.ch.map(function(h){return h.n}).join(", "),by:"You",mine:1}}));
var cs=[];all.forEach(function(r){if(cs.indexOf(r.course)<0)cs.push(r.course)});var q=lib.q.toLowerCase(),list=all.filter(function(r){return(!lib.c||r.course===lib.c)&&(!q||(r.t+r.course+r.topic+r.by).toLowerCase().indexOf(q)>=0)});
return '<h1>Resources</h1><p class="mut">Only resources their owners chose to share appear here. Yours show up when you pick “Shared library” in My Courses.</p><div class="row"><input class="in grow" style="margin:0" id="lq" placeholder="Search title, course, topic…" value="'+e(lib.q)+'" aria-label="Search"><select class="in" style="width:auto;margin:0" id="lc" data-ch="lc"><option value="">All courses</option>'+cs.map(function(c){return '<option'+(lib.c===c?" selected":"")+'>'+e(c)+'</option>'}).join("")+'</select><button class="btn sm" data-a="lsearch">Search</button></div>'+(list.length?list.map(function(r){return '<div class="card"><h2>'+e(r.t)+'</h2><span class="chip">'+e(r.course)+'</span><span class="chip">'+e(r.topic)+'</span><span class="chip">👤 '+e(r.by)+'</span>'+(r.mine?'<p><button class="btn g sm" data-a="open" data-c="0" data-h="0" data-s="0">Open</button></p>':'<p class="sm mut">Demo listing only: no file attached in this prototype.</p>')+'</div>'}).join(""):'<div class="card"><p>No shared resources match. Try another search, or share one of your courses from My Courses.</p></div>')}
function rooms(){return '<h1>Study Rooms</h1><p class="mut">Study the same material with friends. In this version, rooms connect tabs and windows on the same device: open the same room code in a second tab to see it work. Rooms between different devices need an online service, which is the next step.</p><div class="card"><h2>Your name in rooms</h2><input class="in" id="rn" value="'+e(U.nick)+'" maxlength="20" aria-label="Display name"></div><div class="grid"><div class="card"><h2>Create a room</h2><input class="in" id="cn" placeholder="Room name" maxlength="40"><button class="btn" data-a="create">Create &amp; enter</button></div><div class="card"><h2>Join with a code</h2><input class="in" id="jc" placeholder="Room code" maxlength="12"><button class="btn" data-a="joinc">Join</button></div></div><h2>Your rooms</h2>'+(ROOMS.length?ROOMS.map(function(r){return '<div class="card row"><div class="grow"><b>'+e(r.n)+'</b><br><span class="sm mut">Code '+e(r.code)+'</span></div><button class="btn" data-a="enter" data-code="'+e(r.code)+'">Enter</button><button class="btn g" data-a="rmroom" data-code="'+e(r.code)+'">Remove</button></div>'}).join(""):'<div class="card"><p class="mut">No rooms yet. Create one above, or join a friend’s room with their code.</p></div>')}
function progress(){var rate=P.qs?Math.round(P.ok/P.qs*100):0;return '<h1>Progress</h1><p class="mut">This shows effort and growth, not judgement.</p><div class="grid"><div class="card"><h2>📚 Sections studied</h2><div class="clock">'+seenN()+'</div></div><div class="card"><h2>✍️ Questions tried</h2><div class="clock">'+P.qs+'</div><span class="sm mut">'+(P.qs?rate+"% right so far. Tricky ones are the best practice.":"Try a practice question!")+'</span></div><div class="card"><h2>🤝 Group challenges joined</h2><div class="clock">'+P.ch+'</div></div><div class="card"><h2>🔁 Bounce-backs</h2><div class="clock">'+P.retry+'</div><span class="sm mut">Times you tried again after a miss</span></div></div><div class="card"><h2>Badges</h2>'+[[seenN()>0,"🌱 Showed up"],[P.retry>0,"💪 Bounced back"],[P.ch>0,"🤝 Team player"],[seenN()>=P.goal,"🎯 Daily goal"]].map(function(b){return '<span class="chip" style="opacity:'+(b[0]?1:.45)+'">'+b[1]+'</span>'}).join("")+'<p class="sm mut" style="margin-top:8px">Nothing is saved to a server, so progress resets when you close this page.</p><button class="btn g sm" data-a="clearrecent">Clear recent activity</button><button class="btn g sm" data-a="reset">Start completely fresh</button></div>'}
function DEMOC(){return{name:"How the Internet Works (demo)",vis:"private",by:"You",demo:true,ch:[{n:"Chapter 1: The basics",secs:[
{t:"Data travels in small packets",slide:1,ex:"Demo slide 1: Data is split into small packets before it is sent.",say:"When you send a photo or open a web page, the data is chopped into many small pieces called packets. Each packet travels on its own and the pieces are put back together at the other end. This makes sending data faster and more reliable, because a lost packet can be sent again without resending everything.",terms:["packet","reassembly"],sum:"Data is split into packets, sent separately, and rebuilt at the destination.",q:{t:"Why is data split into packets?",o:["So each piece can travel separately and a lost piece can be resent","So the data takes longer to arrive","So it can be hidden from the receiver","So it uses a different language"],a:0,w:"Small packets travel independently, and only a lost packet needs to be sent again."}},
{t:"IP addresses and DNS",slide:2,ex:"Demo slide 2: DNS turns names like example.com into IP addresses.",say:"Every device on the internet has an IP address, a number that works like a postal address. People prefer names such as example.com, so DNS acts like a phone book that turns the name into the matching IP address before your device connects.",terms:["IP address","DNS","domain name"],sum:"An IP address identifies a device, and DNS translates names into IP addresses.",q:{t:"What does DNS do?",o:["Translates a website name into an IP address","Makes your internet faster","Stores your passwords","Blocks viruses"],a:0,w:"DNS works like a phone book, matching names to IP addresses."}},
{t:"Routers pass packets along",slide:3,ex:"Demo slide 3: Routers forward packets towards their destination.",say:"A router is a device that looks at where each packet is going and sends it to the next best step on its journey. A packet usually passes through several routers before it reaches its destination, a bit like a parcel going through several sorting centres.",terms:["router","forwarding"],sum:"Routers forward each packet towards its destination, one hop at a time.",q:{t:"What does a router do with a packet?",o:["Forwards it towards its destination","Deletes it after reading","Turns it into a picture","Stores it forever"],a:0,w:"A router reads the destination and forwards the packet to the next step."}}]}]}}
function ls(){try{return window.localStorage}catch(x){return null}}

settopic:function(){var s=sec();if(!s)return;RM.tp={c:cur.c,h:cur.h,s:cur.s};send("topic",{label:s.t})},
shres:function(){var s=sec();if(!s)return;send("res",{k:cur.c+"-"+cur.h+"-"+cur.s+U.nick,by:U.nick,sec:{t:s.t,slide:s.slide,ex:s.ex,say:s.say,sum:s.sum,terms:s.terms}})},
viewres:function(t){var x=RM.res[+t.dataset.i],s=x.sec;$("#rs").insertAdjacentHTML("beforeend",'<div class="card"><h3>'+e(s.t)+' (slide '+e(s.slide)+')</h3><p>'+e(s.say)+'</p><div class="quote">'+e(s.ex)+'</div><p class="sm mut">Summary: '+e(s.sum)+'</p></div>')},
demo:function(t){demoOn=true;t.disabled=true;RM.msgs.push("👋 Thando, Lerato and Sipho joined (simulated)");rPeople();rChat()},
mic:function(t){RM.m=RM.m?0:1;t.textContent=RM.m?"🎙️ Mic on (demo) · tap to mute":"🔇 Muted · tap to unmute";if(NR)NR.presence({m:RM.m});rPeople()},
spk:function(){spk=1;rPeople();setTimeout(function(){spk=0;RM&&rPeople()},3000)},
chal:function(){var s=sec();if(!s)return;CH=null;send("chal",{id:Date.now(),q:s.q,end:Date.now()+45000})},
pick:function(t){if(CH&&!CH.done){CH.mine=+t.dataset.i;rChal()}},
simpler:function(){var q=CH.q,o=$("#sx");o.innerHTML='<div class="ai">Thinking…</div>';ai("Explain this question and its correct answer to a student in very simple English, in under 90 words, with one everyday example. Do not add facts beyond this.\nQuestion: "+q.t+"\nOptions: "+q.o.join(" | ")+"\nCorrect: "+q.o[q.a]+"\nWhy: "+q.w).then(function(t){o.innerHTML='<div class="ai">'+e(t)+'</div>'}).catch(function(x){o.innerHTML='<div class="ai">'+e(q.w)+'<br><span class="sm mut">('+e(em(x))+' Showing the built-in explanation.)</span></div>'})}};
document.addEventListener("click",function(ev){var t=ev.target.closest("[data-a]");if(t&&A[t.dataset.a])A[t.dataset.a](t)});
document.addEventListener("change",function(ev){var t=ev.target;if(t.dataset.ch==="vis"){COURSES[+t.dataset.c].vis=t.value}else if(t.dataset.ch==="lc"){lib.c=t.value;lib.q=$("#lq").value;render()}else if(t.id==="uf"){var f=t.files[0];if(!f)return;var st=$("#us");st.className="sm mut";if(f.size>15728640){st.className="err";st.textContent="That file is too large (over 15 MB). Try a smaller file or paste the text.";t.value="";return}st.textContent="Reading "+f.name+"…";readDoc(f).then(function(x){x=x.trim();if(x.length<80){st.className="err";st.textContent="I couldn’t find readable text in this file. It may be scanned images, which can’t be read here. Please paste the text instead.";return}$("#ut").value=x.slice(0,12000);st.className="sm mut";st.textContent="Read "+f.name+(x.length>12000?" (long files are shortened to fit)":"")+". Check the text below, then press Build lesson."}).catch(function(m){st.className="err";st.textContent=typeof m==="string"?m:"I couldn’t read that file. It may be damaged or protected. Please paste the text instead."})}});
document.addEventListener("keydown",function(ev){if(ev.key==="Enter"){if(ev.target.id==="cm")A.say();if(ev.target.id==="ask")A.ask();if(ev.target.id==="lq")A.lsearch()}});
var lastE=0;function onErr(){var n=Date.now();if(n-lastE<4000)return;lastE=n;banner("Something went wrong. Please try again. If it keeps happening, use ↺ Start fresh.",1)}
window.addEventListener("error",onErr);window.addEventListener("unhandledrejection",onErr);
window.addEventListener("offline",function(){banner("You’re offline. AI features and live rooms need a connection.",1)});
window.addEventListener("online",function(){banner("You’re back online.")});
load();render();
</script>
